<html dir="rtl" lang="ar">
<head>
	<meta charset="UTF-8">
	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
	<meta content="تأمين 2026 - المنصة الرياضية الرمضانية الشاملة" name="description">
	<meta content="#050a1f" name="theme-color">
	<title>تأمين 2026 | الإصدار الرمضاني البلاتيني (GDMi)</title>
    
    <link rel="stylesheet" href="style.css">
    
	<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&family=Tajawal:wght@300;400;500;700;900&family=Orbitron:wght@400;700;900&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

</head>
	<script src="script.js"></script>
<body>
    <div id="master-truck-preloader">
		<div class="loader">
			<div class="truckWrapper">
				<div class="truckBody">
					<svg class="trucksvg" viewbox="0 0 198 93" xmlns="http://www.w3.org/2000/svg">
					<path d="M135 22.5H177.264C178.295 22.5 179.22 23.133 179.594 24.0939L192.33 56.8443C192.442 57.1332 192.5 57.4404 192.5 57.7504V89C192.5 90.3807 191.381 91.5 190 91.5H135C133.619 91.5 132.5 90.3807 132.5 89V25C132.5 23.6193 133.619 22.5 135 22.5Z" fill="#F83D3D" stroke="#282828" stroke-width="3"></path>

					<path d="M150 65C150 65.39 149.763 65.8656 149.127 66.2893C148.499 66.7083 147.573 67 146.5 67C145.427 67 144.501 66.7083 143.873 66.2893C143.237 65.8656 143 65.39 143 65C143 64.61 143.237 64.1344 143.873 63.7107C144.501 63.2917 145.427 63 146.5 63C147.573 63 148.499 63.2917 149.127 63.7107C149.763 64.1344 150 64.61 150 65Z" fill="#282828" stroke="#282828" stroke-width="2"></path>
					<rect fill="#FFFCAB" height="7" rx="1" stroke="#282828" stroke-width="2" width="5" x="187" y="63"></rect>
					<rect fill="#282828" height="11" rx="1" stroke="#282828" stroke-width="2" width="4" x="193" y="81"></rect>
					<rect fill="#DFDFDF" height="90" rx="2.5" stroke="#282828" stroke-width="3" width="121" x="6.5" y="1.5"></rect>
					<rect fill="#DFDFDF" height="4" rx="2" stroke="#282828" stroke-width="2" width="6" x="1" y="84"></rect></svg>
				</div>
				<div class="truckTires">
					<svg class="tiresvg" viewbox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
					<circle cx="15" cy="15" fill="#282828" r="13.5" stroke="#282828" stroke-width="3"></circle>
					<circle cx="15" cy="15" fill="#DFDFDF" r="7"></circle></svg> <svg class="tiresvg" viewbox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
					<circle cx="15" cy="15" fill="#282828" r="13.5" stroke="#282828" stroke-width="3"></circle>
					<circle cx="15" cy="15" fill="#DFDFDF" r="7"></circle></svg>
				</div>
				<div class="road"></div>
			</div>
		</div>
		<div class="loading-text-style">جاري تحميل نظام تــأمين...</div>
	</div>

    <div class="page" id="radar">
		<h2 class="section-title">التحليل الفني والتحركات</h2>
		<div class="radar-controls">
			<button class="radar-btn active" onclick="toggleRadarMode('pitch', this)"><i class="fas fa-futbol"></i> الملعب التفاعلي</button>
            <button class="radar-btn" onclick="toggleRadarMode('stats', this)"><i class="fas fa-table"></i> الإحصائيات والأرقام</button>
            <button class="radar-btn" id="tactical-view-toggle"><i class="fas fa-cube"></i> المنظور</button>
            
            <button class="radar-btn" onclick="downloadTacticImage()" style="background: #d4af37; color: #000;">
                <i class="fas fa-camera"></i> تحميل التكتيك
            </button>
		</div>
		<div id="pitch-view">
			<div id="tactical-pitch-wrapper">
				<div id="live-coord"><span id="coord-label"></span></div>
				<div id="tactical-futsal-pitch">
					<div class="tp-midline"></div>
					<div class="tp-center-circle"></div>
					<div class="tp-penalty-arc home"></div>
					<div class="tp-penalty-arc away"></div>
				</div>
			</div>
		</div>
        </div>

    <script src="script.js"></script>
</body>
</html>
